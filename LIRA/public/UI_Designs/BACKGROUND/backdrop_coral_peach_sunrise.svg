<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="c1-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EC"/><stop offset="100%" stop-color="#F7E4D6"/>
    </linearGradient>
    <radialGradient id="c1-glow1" cx="25%" cy="20%" r="42%"><stop offset="0%" stop-color="#F3C4C0" stop-opacity="0.8"/><stop offset="100%" stop-color="#F3C4C0" stop-opacity="0"/></radialGradient>
    <radialGradient id="c1-glow2" cx="80%" cy="75%" r="45%"><stop offset="0%" stop-color="#F7D2B0" stop-opacity="0.85"/><stop offset="100%" stop-color="#F7D2B0" stop-opacity="0"/></radialGradient>
    <radialGradient id="c1-glow3" cx="75%" cy="15%" r="28%"><stop offset="0%" stop-color="#F7EFC6" stop-opacity="0.6"/><stop offset="100%" stop-color="#F7EFC6" stop-opacity="0"/></radialGradient>
    <filter id="c1-blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#c1-base)"/>
  <g filter="url(#c1-blur)">
    <ellipse cx="360" cy="200" rx="280" ry="200" fill="url(#c1-glow1)"/>
    <ellipse cx="1280" cy="700" rx="300" ry="220" fill="url(#c1-glow2)"/>
    <ellipse cx="1180" cy="140" rx="200" ry="150" fill="url(#c1-glow3)"/>
  </g>
  <!-- layered horizon bands for a sunrise feel -->
  <path d="M0,620 C300,580 520,650 820,600 C1120,550 1360,610 1600,580 L1600,900 L0,900 Z" fill="#F3C4C0" opacity="0.35"/>
  <path d="M0,700 C300,670 560,730 850,690 C1140,650 1380,710 1600,680 L1600,900 L0,900 Z" fill="#E2938C" opacity="0.3"/>
  <!-- soft sun disc -->
  <circle cx="800" cy="520" r="90" fill="#F7D2B0" opacity="0.7"/>
  <circle cx="800" cy="520" r="56" fill="#FBE8D6" opacity="0.85"/>
  <g fill="#EDA97A" opacity="0.55">
    <circle cx="260" cy="420" r="5"/><circle cx="1340" cy="400" r="5"/><circle cx="900" cy="300" r="4"/>
  </g>
