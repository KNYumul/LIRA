<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EC"/>
      <stop offset="100%" stop-color="#F2EEDD"/>
    </linearGradient>
    <radialGradient id="glow-sky" cx="50%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#CDEEF5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#CDEEF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-butter" cx="80%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#F7EFC6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F7EFC6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DCE7CE"/>
      <stop offset="100%" stop-color="#C9DAB6"/>
    </linearGradient>
    <linearGradient id="hill-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C3D6B0"/>
      <stop offset="100%" stop-color="#AFC79A"/>
    </linearGradient>
    <linearGradient id="hill-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A9C58F"/>
      <stop offset="100%" stop-color="#93B378"/>
    </linearGradient>
    <linearGradient id="tree-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FC488"/>
      <stop offset="100%" stop-color="#7FAE6C"/>
    </linearGradient>
    <linearGradient id="tree-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B7D19F"/>
      <stop offset="100%" stop-color="#9AC17F"/>
    </linearGradient>
    <filter id="bg-blur-lg"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="bg-blur-sm"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#sky-grad)"/>
  <circle cx="800" cy="160" r="360" fill="url(#glow-sky)"/>
  <circle cx="1300" cy="120" r="260" fill="url(#glow-butter)"/>

  <!-- soft floating watercolor blobs -->
  <g filter="url(#bg-blur-lg)" opacity="0.5">
    <ellipse cx="220" cy="180" rx="150" ry="110" fill="#CDEEF5"/>
    <ellipse cx="1420" cy="260" rx="170" ry="120" fill="#F7D2B0"/>
    <ellipse cx="700" cy="90" rx="130" ry="90" fill="#F7EFC6"/>
  </g>

  <!-- distant clouds -->
  <g fill="#FFFFFF" opacity="0.7" filter="url(#bg-blur-sm)">
    <ellipse cx="260" cy="120" rx="60" ry="24"/>
    <ellipse cx="310" cy="110" rx="46" ry="20"/>
    <ellipse cx="1180" cy="90" rx="70" ry="26"/>
    <ellipse cx="1240" cy="100" rx="50" ry="20"/>
  </g>

  <!-- rolling hills, back to front -->
  <path d="M0,560 C300,500 500,600 800,540 C1100,480 1350,560 1600,520 L1600,900 L0,900 Z" fill="url(#hill-back)"/>
  <path d="M0,640 C260,590 520,660 820,610 C1120,560 1360,640 1600,600 L1600,900 L0,900 Z" fill="url(#hill-mid)"/>
  <path d="M0,740 C300,700 560,760 850,720 C1140,680 1380,750 1600,710 L1600,900 L0,900 Z" fill="url(#hill-front)"/>

  <!-- tree clusters (simple watercolor-style rounded canopies) -->
  <g>
    <ellipse cx="160" cy="600" rx="46" ry="52" fill="url(#tree-grad)" opacity="0.9"/>
    <ellipse cx="210" cy="618" rx="36" ry="42" fill="url(#tree-grad-2)" opacity="0.85"/>
    <rect x="152" y="640" width="16" height="46" rx="6" fill="#8A6A3F"/>

    <ellipse cx="1440" cy="640" rx="52" ry="58" fill="url(#tree-grad)" opacity="0.9"/>
    <ellipse cx="1500" cy="660" rx="40" ry="46" fill="url(#tree-grad-2)" opacity="0.85"/>
    <rect x="1430" y="686" width="18" height="50" rx="6" fill="#8A6A3F"/>

    <ellipse cx="1300" cy="580" rx="34" ry="38" fill="url(#tree-grad-2)" opacity="0.8"/>
    <rect x="1292" y="608" width="12" height="34" rx="5" fill="#8A6A3F"/>

    <ellipse cx="60" cy="700" rx="40" ry="44" fill="url(#tree-grad)" opacity="0.85"/>
    <rect x="52" y="732" width="14" height="40" rx="5" fill="#8A6A3F"/>
  </g>

  <!-- little mushroom + flower details for the storybook feel -->
  <g>
    <ellipse cx="900" cy="820" rx="14" ry="9" fill="#E2938C"/>
    <rect x="895" y="822" width="10" height="14" rx="4" fill="#FBF6EC"/>
    <circle cx="1100" cy="800" r="6" fill="#F7EFC6"/>
    <circle cx="1120" cy="810" r="5" fill="#F7D2B0"/>
    <circle cx="500" cy="810" r="6" fill="#CDEEF5"/>
    <circle cx="520" cy="822" r="5" fill="#F7EFC6"/>
  </g>
</svg>
