<svg viewBox="0 0 1600 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes floatBunny {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-3deg); }
      }
      @keyframes floatFox {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(3deg); }
      }
      .anim-bunny {
        animation: floatBunny 3s ease-in-out infinite;
        transform-origin: 100px 750px;
      }
      .anim-fox {
        animation: floatFox 3.4s ease-in-out infinite 0.5s;
        transform-origin: 1500px 750px;
      }
    </style>
    <linearGradient id="o8-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CDEEF5"/><stop offset="55%" stop-color="#EAF6EC"/><stop offset="100%" stop-color="#D9E4CD"/>
    </linearGradient>
    <radialGradient id="o8-vignette" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#FBF6EC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FBF6EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="o8-grassA" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#B7D19F"/><stop offset="100%" stop-color="#9AC17F"/></linearGradient>
    <linearGradient id="o8-grassB" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#9AC17F"/><stop offset="100%" stop-color="#83AE68"/></linearGradient>
    <filter id="o8-blur"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#o8-sky)"/>

  <!-- sun, upper corner -->
  <circle cx="1420" cy="110" r="66" fill="#F7EFC6" opacity="0.8"/>
  <circle cx="1420" cy="110" r="42" fill="#FBF6DE" opacity="0.9"/>

  <!-- clouds scattered across the top -->
  <g fill="#FFFFFF" opacity="0.85" filter="url(#o8-blur)">
    <ellipse cx="220" cy="100" rx="54" ry="20"/><ellipse cx="270" cy="92" rx="38" ry="16"/>
    <ellipse cx="700" cy="70" rx="46" ry="16"/>
    <ellipse cx="1050" cy="110" rx="40" ry="15"/>
  </g>

  <!-- butterflies scattered mid-scene -->
  <g opacity="0.65">
    <g transform="translate(180,260)"><path d="M0,0 C-10,-14 -24,-10 -18,2 C-24,10 -10,14 0,0 Z" fill="#E2938C"/><path d="M0,0 C10,-14 24,-10 18,2 C24,10 10,14 0,0 Z" fill="#E2938C"/></g>
    <g transform="translate(1340,330) scale(0.85)"><path d="M0,0 C-10,-14 -24,-10 -18,2 C-24,10 -10,14 0,0 Z" fill="#9FD8E6"/><path d="M0,0 C10,-14 24,-10 18,2 C24,10 10,14 0,0 Z" fill="#9FD8E6"/></g>
    <g transform="translate(260,500) scale(0.7)"><path d="M0,0 C-10,-14 -24,-10 -18,2 C-24,10 -10,14 0,0 Z" fill="#EDD98C"/><path d="M0,0 C10,-14 24,-10 18,2 C24,10 10,14 0,0 Z" fill="#EDD98C"/></g>
  </g>

  <!-- rolling grass hills, full width -->
  <path d="M0,560 C300,520 540,600 820,560 C1100,520 1360,580 1600,540 L1600,900 L0,900 Z" fill="url(#o8-grassA)" opacity="0.85"/>
  <path d="M0,660 C300,630 560,690 850,650 C1140,610 1380,670 1600,640 L1600,900 L0,900 Z" fill="url(#o8-grassB)" opacity="0.85"/>

  <!-- scattered flowers along the grass -->
  <g>
    <g transform="translate(120,700)"><circle r="8" fill="#EDD98C"/><circle cx="13" cy="4" r="7" fill="#F7EFC6"/><circle cx="-11" cy="6" r="7" fill="#F7EFC6"/><circle cx="2" cy="-12" r="7" fill="#F7EFC6"/></g>
    <g transform="translate(1480,730)"><circle r="8" fill="#E2938C"/><circle cx="13" cy="4" r="7" fill="#F3C4C0"/><circle cx="-11" cy="6" r="7" fill="#F3C4C0"/><circle cx="2" cy="-12" r="7" fill="#F3C4C0"/></g>
    <g transform="translate(60,820)"><circle r="6" fill="#9FD8E6"/><circle cx="10" cy="3" r="5" fill="#CDEEF5"/><circle cx="-8" cy="5" r="5" fill="#CDEEF5"/></g>
    <g transform="translate(1540,840)"><circle r="6" fill="#EDA97A"/><circle cx="10" cy="3" r="5" fill="#F7D2B0"/><circle cx="-8" cy="5" r="5" fill="#F7D2B0"/></g>
    <g transform="translate(400,780)"><circle r="5" fill="#E2938C"/><circle cx="8" cy="2" r="4" fill="#F3C4C0"/><circle cx="-6" cy="4" r="4" fill="#F3C4C0"/></g>
    <g transform="translate(1200,800)"><circle r="5" fill="#EDD98C"/><circle cx="8" cy="2" r="4" fill="#F7EFC6"/><circle cx="-6" cy="4" r="4" fill="#F7EFC6"/></g>
  </g>

  <!-- bunny lifted up to y=750 (ANIMATED) -->
  <g class="anim-bunny" opacity="0.95">
    <g transform="translate(110,750) scale(1.1)">
      <ellipse cx="0" cy="0" rx="46" ry="34" fill="#F7EFC6"/>
      <ellipse cx="-18" cy="-66" rx="11" ry="34" fill="#F7EFC6" transform="rotate(-8)"/>
      <ellipse cx="16" cy="-66" rx="11" ry="34" fill="#F7EFC6" transform="rotate(8)"/>
      <circle cx="-14" cy="-18" r="3.5" fill="#3F3B35"/><circle cx="14" cy="-18" r="3.5" fill="#3F3B35"/>
      <ellipse cx="0" cy="-8" rx="5" ry="4" fill="#EDA97A"/>
    </g>
  </g>

  <!-- fox lifted up to y=750 (ANIMATED) -->
  <g class="anim-fox" opacity="0.95">
    <g transform="translate(1480,750) scale(1.05)">
      <ellipse cx="0" cy="0" rx="44" ry="32" fill="#EDA97A"/>
      <circle cx="0" cy="-40" r="26" fill="#F7D2B0"/>
      <path d="M-24,-54 L-36,-76 L-12,-64 Z" fill="#EDA97A"/><path d="M24,-54 L36,-76 L12,-64 Z" fill="#EDA97A"/>
      <circle cx="-10" cy="-40" r="4.5" fill="#3F3B35"/><circle cx="10" cy="-40" r="4.5" fill="#3F3B35"/>
      <ellipse cx="0" cy="-30" rx="7" ry="5" fill="#fff"/>
    </g>
  </g>

  <!-- gentle vignette so the center stays light and legible for the text card -->
  <rect width="1600" height="900" fill="url(#o8-vignette)"/>
</svg>