<!--
  LIRA Reading Page Template
  This matches the "paper" card that appears when a story is opened in Story Mode.
  HOW TO USE:
  1. The dashed rectangle marks the content slot (760 x 480px) — this is where the story text
     or illustration goes. Delete the placeholder <rect> + <text> lines inside id="content-slot"
     and put your own text, image, or <foreignObject> HTML in the same x/y/width/height.
  2. The bound-edge shadow (left) and curled corner (bottom right) are separate layers on top,
     so anything you place in the slot will still look correctly seated on the page.
  3. Ruled lines are decorative guide lines — delete the <g id="ruled-lines"> group if you don't want them.
-->
<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FBF6EC"/>
    </linearGradient>
    <linearGradient id="bound-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pageClip">
      <path d="M18,10 L866,10 Q882,10 882,26 L882,654 Q882,670 866,670 L18,670 Q10,670 10,662 L10,18 Q10,10 18,10 Z"/>
    </clipPath>
  </defs>

  <!-- drop shadow beneath the page -->
  <rect x="14" y="18" width="872" height="662" rx="14" fill="#3F3B35" opacity="0.10"/>

  <!-- page body -->
  <g clip-path="url(#pageClip)">
    <rect x="0" y="0" width="900" height="680" fill="url(#paper-grad)"/>

    <!-- faint ruled lines, like notebook/story paper -->
    <g id="ruled-lines" opacity="0.5">
      <g stroke="#EDE4CC" stroke-width="1.5">
        <line x1="60" y1="120" x2="840" y2="120"/>
        <line x1="60" y1="147" x2="840" y2="147"/>
        <line x1="60" y1="174" x2="840" y2="174"/>
        <line x1="60" y1="201" x2="840" y2="201"/>
        <line x1="60" y1="228" x2="840" y2="228"/>
        <line x1="60" y1="255" x2="840" y2="255"/>
        <line x1="60" y1="282" x2="840" y2="282"/>
        <line x1="60" y1="309" x2="840" y2="309"/>
        <line x1="60" y1="336" x2="840" y2="336"/>
        <line x1="60" y1="363" x2="840" y2="363"/>
        <line x1="60" y1="390" x2="840" y2="390"/>
        <line x1="60" y1="417" x2="840" y2="417"/>
        <line x1="60" y1="444" x2="840" y2="444"/>
        <line x1="60" y1="471" x2="840" y2="471"/>
        <line x1="60" y1="498" x2="840" y2="498"/>
        <line x1="60" y1="525" x2="840" y2="525"/>
      </g>
    </g>

    <!-- bound edge shadow, left side -->
    <rect x="10" y="10" width="70" height="660" fill="url(#bound-shadow)"/>
  </g>

  <!-- page outline -->
  <path d="M18,10 L866,10 Q882,10 882,26 L882,654 Q882,670 866,670 L18,670 Q10,670 10,662 L10,18 Q10,10 18,10 Z"
        fill="none" stroke="#EDE4CC" stroke-width="1.5"/>

  <!-- ===== CONTENT SLOT — replace with your story text / illustration ===== -->
  <g id="content-slot">
    <rect x="70" y="100" width="760" height="480" fill="none" stroke="#9FD8E6" stroke-width="2" stroke-dasharray="9 7" opacity="0.8"/>
  </g>
  <!-- ===== end content slot ===== -->

  <!-- curled corner, bottom right -->
  <polygon points="882,654 882,616 844,654" fill="#F3EBD9"/>
  <polygon points="882,654 882,616 844,654" fill="none" stroke="#E4D9B8" stroke-width="1"/>
  <path d="M882,616 Q860,630 844,654" fill="none" stroke="#D9CBA0" stroke-width="1" opacity="0.6"/>
</svg>
