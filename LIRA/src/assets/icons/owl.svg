<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="owl-wash" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#F7EFC6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F7EFC6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="owl-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0DD9C"/>
      <stop offset="100%" stop-color="#E4CB77"/>
    </linearGradient>
    <linearGradient id="owl-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF6E4"/>
      <stop offset="100%" stop-color="#F3E8C0"/>
    </linearGradient>
    <linearGradient id="owl-wing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A9D8E0"/>
      <stop offset="100%" stop-color="#8FC4D0"/>
    </linearGradient>
    <filter id="owl-blur"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <!-- watercolor wash -->
  <ellipse cx="120" cy="110" rx="100" ry="95" fill="url(#owl-wash)" filter="url(#owl-blur)"/>

  <!-- feet -->
  <ellipse cx="100" cy="196" rx="10" ry="6" fill="#E4A15C"/>
  <ellipse cx="140" cy="196" rx="10" ry="6" fill="#E4A15C"/>

  <!-- body -->
  <ellipse cx="120" cy="140" rx="72" ry="66" fill="url(#owl-body)"/>
  <!-- belly feather texture -->
  <path d="M90,120 Q120,140 150,120" stroke="#D9BE72" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M86,148 Q120,172 154,148" stroke="#D9BE72" stroke-width="4" fill="none" opacity="0.5"/>
  <path d="M92,176 Q120,196 148,176" stroke="#D9BE72" stroke-width="4" fill="none" opacity="0.5"/>

  <!-- wings -->
  <path d="M48,110 C28,130 26,168 44,192 C56,178 60,140 60,116 Z" fill="url(#owl-wing)"/>
  <path d="M192,110 C212,130 214,168 196,192 C184,178 180,140 180,116 Z" fill="url(#owl-wing)"/>

  <!-- ear tufts -->
  <path d="M78,58 L60,20 L98,44 Z" fill="#E4CB77"/>
  <path d="M162,58 L180,20 L142,44 Z" fill="#E4CB77"/>

  <!-- head / face disc -->
  <circle cx="120" cy="86" r="60" fill="url(#owl-face)"/>

  <!-- eye discs -->
  <circle cx="96" cy="82" r="22" fill="#FFFFFF"/>
  <circle cx="144" cy="82" r="22" fill="#FFFFFF"/>
  <circle cx="96" cy="82" r="22" fill="none" stroke="#E4CB77" stroke-width="3"/>
  <circle cx="144" cy="82" r="22" fill="none" stroke="#E4CB77" stroke-width="3"/>
  <circle cx="98" cy="84" r="10" fill="#4E6B45"/>
  <circle cx="146" cy="84" r="10" fill="#4E6B45"/>
  <circle cx="101" cy="80" r="3" fill="#FFFFFF"/>
  <circle cx="149" cy="80" r="3" fill="#FFFFFF"/>

  <!-- brows for friendly expression -->
  <path d="M78,58 Q96,50 114,60" stroke="#C79A46" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M126,60 Q144,50 162,58" stroke="#C79A46" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- beak -->
  <path d="M112,100 L120,116 L128,100 Z" fill="#EDA97A"/>

  <!-- cheeks -->
  <circle cx="82" cy="102" r="8" fill="#F3C4C0" opacity="0.6"/>
  <circle cx="158" cy="102" r="8" fill="#F3C4C0" opacity="0.6"/>
</svg>
